# Integración continua: en cada push o PR se verifica lint, tipos,
# build completo y las dos suites de tests. Lo mismo que se corre local
# antes de commitear, pero garantizado para cualquier colaborador.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tipos + bundles)
        run: npm run build

      - name: Tests
        run: npm test
